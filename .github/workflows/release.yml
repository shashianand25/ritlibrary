name: Release & Deployment Pipeline

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"

      - name: Install Workspace Dependencies
        run: npm ci

      - name: Run Full Test Suite & Coverage
        run: npm run test:coverage

      - name: Build Frontend Production Bundle
        run: npm run build

      - name: Package Dist Assets
        run: |
          mkdir -p release-assets
          tar -czf release-assets/ritlibrary-frontend-bundle.tar.gz -C my-project/dist .

      - name: Generate Release Notes & Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-assets/ritlibrary-frontend-bundle.tar.gz
          generate_release_notes: true
