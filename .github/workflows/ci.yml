name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint & Code Style Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: my-project/package-lock.json

      - name: Install Dependencies
        run: npm --prefix my-project ci

      - name: Run ESLint
        run: npm --prefix my-project run lint

      - name: Run Prettier Check
        run: npm --prefix my-project run format:check

  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: my-project/package-lock.json

      - name: Install Dependencies
        run: npm --prefix my-project ci

      - name: Run Typecheck
        run: npm --prefix my-project run typecheck

  test:
    name: Automated Unit & Component Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: my-project/package-lock.json

      - name: Install Dependencies
        run: npm --prefix my-project ci

      - name: Run Vitest with Coverage Thresholds
        run: npm --prefix my-project run test:coverage

  security:
    name: Security Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: my-project/package-lock.json

      - name: Audit Dependencies
        run: npm --prefix my-project audit --audit-level=critical || true

  build:
    name: Production Build Verification
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: my-project/package-lock.json

      - name: Install Dependencies
        run: npm --prefix my-project ci

      - name: Build React Vite Application
        run: npm --prefix my-project run build
