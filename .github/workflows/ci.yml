name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint & Code Style Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            my-project/package-lock.json
            library-backend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm --prefix my-project ci

      - name: Run Frontend ESLint
        run: npm --prefix my-project run lint

      - name: Run Frontend Prettier Check
        run: npm --prefix my-project run format:check

      - name: Install Backend Dependencies
        run: npm --prefix library-backend ci

      - name: Run Backend ESLint
        run: npm --prefix library-backend run lint

      - name: Run Backend Prettier Check
        run: npm --prefix library-backend run format:check

  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: my-project/package-lock.json

      - name: Install Dependencies
        run: npm --prefix my-project ci

      - name: Run Typecheck
        run: npm --prefix my-project run typecheck

  test-frontend:
    name: Frontend Automated Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: my-project/package-lock.json

      - name: Install Dependencies
        run: npm --prefix my-project ci

      - name: Run Vitest with Coverage Thresholds
        run: npm --prefix my-project run test:coverage

      - name: Upload Frontend Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: my-project/coverage/
          retention-days: 14

  test-backend:
    name: Backend Worker Isolated Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: library-backend/package-lock.json

      - name: Install Dependencies
        run: npm --prefix library-backend ci

      - name: Run Backend Tests with Coverage Thresholds
        run: npm --prefix library-backend run test:coverage

      - name: Upload Backend Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: library-backend/coverage/
          retention-days: 14

  security:
    name: Security Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            my-project/package-lock.json
            library-backend/package-lock.json

      - name: Audit Monorepo & Subproject Dependencies
        run: |
          npm audit --audit-level=critical || true
          npm --prefix my-project audit --audit-level=critical || true
          npm --prefix library-backend audit --audit-level=critical || true

  build:
    name: Production Build Verification
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-frontend, test-backend]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: my-project/package-lock.json

      - name: Install Dependencies
        run: npm --prefix my-project ci

      - name: Build React Vite Application
        run: npm --prefix my-project run build

      - name: Upload Production Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: my-project/dist/
          retention-days: 7

  ci-status:
    name: CI Pipeline Quality Gate
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-frontend, test-backend, security, build]
    if: always()
    steps:
      - name: Evaluate Pipeline Status
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.typecheck.result }}" != "success" ] || \
             [ "${{ needs.test-frontend.result }}" != "success" ] || \
             [ "${{ needs.test-backend.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo "CI Quality Gate Failed: One or more required checks did not pass."
            exit 1
          fi
          echo "CI Quality Gate Passed: All required lint, typecheck, test, coverage, and build checks succeeded!"

